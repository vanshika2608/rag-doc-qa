<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocQA — Ask your documents</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --accent: #7fff6e;
      --accent-dim: rgba(127,255,110,0.12);
      --text: #e8e8e8;
      --text-muted: #666;
      --error: #ff6b6b;
      --font: 'IBM Plex Sans', sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      height: 100vh;
      display: grid;
      grid-template-columns: 300px 1fr;
    }

    /* ── SIDEBAR ── */
    aside {
      border-right: 1px solid var(--border);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .logo {
      font-family: var(--mono);
      font-size: 15px;
      color: var(--accent);
      letter-spacing: -0.02em;
    }
    .logo span { color: var(--text-muted); }

    .upload-zone {
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--accent);
      background: var(--accent-dim);
    }
    .upload-zone input { display: none; }
    .upload-icon {
      font-size: 28px;
      margin-bottom: 10px;
      color: var(--text-muted);
    }
    .upload-zone p { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
    .upload-zone p strong { color: var(--text); display: block; margin-bottom: 4px; font-size: 14px; }

    .status-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 12px;
      font-family: var(--mono);
      color: var(--text-muted);
      min-height: 56px;
      line-height: 1.6;
    }
    .status-box.success { border-color: var(--accent); color: var(--accent); }
    .status-box.error { border-color: var(--error); color: var(--error); }
    .status-box.loading { animation: pulse 1.5s ease-in-out infinite; }

    .info {
      margin-top: auto;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.7;
    }
    .info a { color: var(--accent); text-decoration: none; }

    /* ── CHAT AREA ── */
    main {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .chat-header {
      padding: 20px 28px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-muted);
      font-family: var(--mono);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .message { display: flex; flex-direction: column; gap: 6px; max-width: 720px; }
    .message.user { align-self: flex-end; align-items: flex-end; }
    .message.bot { align-self: flex-start; }

    .msg-label { font-size: 11px; font-family: var(--mono); color: var(--text-muted); }
    .message.user .msg-label { color: var(--accent); opacity: 0.7; }

    .msg-bubble {
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.7;
    }
    .message.user .msg-bubble {
      background: var(--accent-dim);
      border: 1px solid rgba(127,255,110,0.2);
      color: var(--text);
    }
    .message.bot .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .sources {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .source-chip {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      line-height: 1.5;
    }
    .source-chip strong { color: var(--accent); margin-right: 6px; }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
    }
    .empty-state .big { font-size: 36px; }

    /* ── INPUT BAR ── */
    .chat-input-area {
      padding: 20px 28px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
    }
    .chat-input-area textarea {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      padding: 12px 16px;
      resize: none;
      outline: none;
      height: 48px;
      max-height: 120px;
      transition: border-color 0.2s;
      line-height: 1.5;
    }
    .chat-input-area textarea:focus { border-color: var(--accent); }
    .chat-input-area textarea::placeholder { color: var(--text-muted); }

    .send-btn {
      background: var(--accent);
      color: #0a1f08;
      border: none;
      border-radius: 8px;
      width: 48px;
      height: 48px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }
    .send-btn:hover { opacity: 0.85; }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

    .thinking { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
    .thinking span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-muted);
      animation: bounce 1.2s ease-in-out infinite;
    }
    .thinking span:nth-child(2) { animation-delay: 0.15s; }
    .thinking span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
  </style>
</head>
<body>

<aside>
  <div class="logo">doc<span>/</span>qa</div>

  <label class="upload-zone" id="upload-zone">
    <input type="file" id="file-input" accept=".pdf">
    <div class="upload-icon">⬆</div>
    <p><strong>Upload a PDF</strong>Click or drag and drop</p>
  </label>

  <div class="status-box" id="status">Waiting for document...</div>

  <div class="info">
    Built with Flask · LangChain · Gemini · FAISS<br>
    Free to run · <a href="https://aistudio.google.com" target="_blank">Get Gemini API key →</a>
  </div>
</aside>

<main>
  <div class="chat-header">// ask anything about your document</div>

  <div class="chat-messages" id="chat-messages">
    <div class="empty-state" id="empty-state">
      <div class="big">📄</div>
      <div>Upload a PDF to start asking questions</div>
    </div>
  </div>

  <div class="chat-input-area">
    <textarea id="question-input" placeholder="Ask a question about your document..." rows="1" disabled></textarea>
    <button class="send-btn" id="send-btn" disabled>→</button>
  </div>
</main>

<script>
  const fileInput = document.getElementById('file-input');
  const uploadZone = document.getElementById('upload-zone');
  const statusBox = document.getElementById('status');
  const chatMessages = document.getElementById('chat-messages');
  const emptyState = document.getElementById('empty-state');
  const questionInput = document.getElementById('question-input');
  const sendBtn = document.getElementById('send-btn');

  let documentLoaded = false;

  // ── DRAG AND DROP ──
  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
  uploadZone.addEventListener('drop', e => {
    e.preventDefault();
    uploadZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) uploadFile(file);
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) uploadFile(fileInput.files[0]);
  });

  // ── UPLOAD ──
  async function uploadFile(file) {
    if (!file.name.endsWith('.pdf')) {
      setStatus('Only PDF files supported.', 'error');
      return;
    }

    setStatus(`Processing "${file.name}"...`, 'loading');

    const formData = new FormData();
    formData.append('file', file);

    try {
      const res = await fetch('/upload', { method: 'POST', body: formData });
      const data = await res.json();

      if (res.ok) {
        setStatus(`✓ ${data.message}\n${data.chunks} chunks indexed`, 'success');
        documentLoaded = true;
        questionInput.disabled = false;
        sendBtn.disabled = false;
        questionInput.focus();
      } else {
        setStatus(`Error: ${data.error}`, 'error');
      }
    } catch (err) {
      setStatus('Network error. Is Flask running?', 'error');
    }
  }

  // ── CHAT ──
  questionInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); }
  });
  sendBtn.addEventListener('click', sendQuestion);

  async function sendQuestion() {
    const q = questionInput.value.trim();
    if (!q || !documentLoaded) return;

    questionInput.value = '';
    emptyState?.remove();

    appendMessage('user', q);
    const thinkingEl = appendThinking();
    sendBtn.disabled = true;

    try {
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q })
      });
      const data = await res.json();

      thinkingEl.remove();

      if (res.ok) {
        appendMessage('bot', data.answer, data.sources);
      } else {
        appendMessage('bot', `Error: ${data.error}`);
      }
    } catch (err) {
      thinkingEl.remove();
      appendMessage('bot', 'Network error. Check the Flask server.');
    }

    sendBtn.disabled = false;
    questionInput.focus();
  }

  function appendMessage(role, text, sources = []) {
    const msg = document.createElement('div');
    msg.className = `message ${role}`;

    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = role === 'user' ? 'you' : 'docqa';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;

    msg.appendChild(label);
    msg.appendChild(bubble);

    if (sources.length > 0) {
      const sourcesEl = document.createElement('div');
      sourcesEl.className = 'sources';
      sources.forEach(s => {
        const chip = document.createElement('div');
        chip.className = 'source-chip';
        chip.innerHTML = `<strong>pg ${s.page}</strong>${s.snippet}`;
        sourcesEl.appendChild(chip);
      });
      msg.appendChild(sourcesEl);
    }

    chatMessages.appendChild(msg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function appendThinking() {
    const msg = document.createElement('div');
    msg.className = 'message bot';

    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = 'docqa';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = '<div class="thinking"><span></span><span></span><span></span></div>';

    msg.appendChild(label);
    msg.appendChild(bubble);
    chatMessages.appendChild(msg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return msg;
  }

  function setStatus(msg, type = '') {
    statusBox.textContent = msg;
    statusBox.className = `status-box ${type}`;
  }
</script>
</body>
</html>
